apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fai-qa
resources: [../../base]
configMapGenerator:
  - name: fai-config
    literals:
      - APP_ENV=qa
      - LLM_PROVIDER=azure
      - VECTOR_STORE=azure_search
      - AZURE_OPENAI_ENDPOINT=REPLACE_ME
      - AZURE_SEARCH_ENDPOINT=REPLACE_ME
patches:
  - target: { kind: Deployment, name: fai-api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
